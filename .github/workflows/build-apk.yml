name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Desculpa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Desculpa-apk
          path: Desculpa.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Desculpa APK
          target_commitish: ${{ github.sha }}
          files: Desculpa.apk
          make_latest: true
