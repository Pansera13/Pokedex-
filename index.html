<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokedex - Cartas Repetidas</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1f26;
    --panel2: #22262f;
    --border: #2c313c;
    --border-strong: #3a4150;
    --text: #eef0f4;
    --text-secondary: #9aa2b1;
    --text-muted: #6b7280;
    --accent: #ffcb05;
    --accent-dark: #2a75bb;
    --dup: #e0524a;
    --dup-bg: #3a2020;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  header{position:sticky;top:0;background:var(--bg);z-index:5;padding:16px 0 12px;border-bottom:1px solid var(--border);}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
  h1 .ball{width:22px;height:22px;border-radius:50%;background:linear-gradient(#ee1515 0 48%, #222 48% 52%, #fff 52% 100%);border:2px solid #222;flex:none;}
  .sub{font-size:13px;color:var(--text-secondary);margin:0 0 14px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  input[type=search]{
    flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px;outline:none;
  }
  input[type=search]:focus{border-color:var(--accent-dark);}
  select{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:8px;font-size:13px;outline:none;
  }
  .toggle-dup{
    background:var(--panel2);border:1px solid var(--border);color:var(--text-secondary);
    padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .toggle-dup.active{background:var(--dup-bg);border-color:var(--dup);color:#ffb3ae;}
  .stats{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--text-secondary);}
  .stats b{color:var(--text);font-weight:700;}
  .stats .dup-count b{color:var(--dup);}
  .clear-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-left:auto;
  }
  .clear-btn:hover{border-color:var(--dup);color:var(--dup);}
  .gens{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .gen-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text-secondary);
    padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer;
  }
  .gen-btn.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(150px,1fr));gap:10px;margin-top:18px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;cursor:pointer;user-select:none;display:flex;flex-direction:column;gap:4px;
    transition:border-color .12s, background .12s;
  }
  .card:hover{border-color:var(--border-strong);}
  .card.checked{background:var(--dup-bg);border-color:var(--dup);}
  .card-top{display:flex;justify-content:space-between;align-items:center;}
  .num{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .card.checked .num{color:#ffb3ae;}
  .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;}
  .card.checked .box{background:var(--dup);border-color:var(--dup);}
  .box svg{width:11px;height:11px;display:none;}
  .card.checked .box svg{display:block;}
  .name{font-size:13.5px;font-weight:600;line-height:1.25;}
  .tag{font-size:10px;color:var(--accent);}
  .empty{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;font-size:13px;}
  footer{margin-top:24px;font-size:11px;color:var(--text-muted);text-align:center;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="ball"></span>Pokedex &mdash; separador de repetidas</h1>
    <p class="sub">Marque as cartas que voce tem repetidas. Fica salvo automaticamente neste dispositivo.</p>
    <div class="controls">
      <input type="search" id="search" placeholder="Buscar por nome ou numero (ex: 25, Pikachu)">
      <select id="sort">
        <option value="dex">Ordem da Pokedex</option>
        <option value="az">A-Z</option>
      </select>
      <button class="toggle-dup" id="toggleDup">Mostrar so repetidas</button>
    </div>
    <div class="gens" id="gens"></div>
    <div class="stats">
      <span>Exibindo <b id="showCount">0</b> de <b id="totalCount">0</b></span>
      <span class="dup-count">Repetidas marcadas: <b id="dupCount">0</b></span>
      <span id="saveStatus" style="color:var(--text-muted);"></span>
      <button class="clear-btn" id="clearBtn">limpar marcacoes</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Nacional Pokedex &middot; 1 - 1025 &middot; dados via PokeAPI</footer>
</div>

  const toggleDup = document.getElementById('toggleDup');
  const gensEl = document.getElementById('gens');
  const clearBtn = document.getElementById('clearBtn');
  const showCountEl = document.getElementById('showCount');
  const totalCountEl = document.getElementById('totalCount');
  const dupCountEl = document.getElementById('dupCount');
  const saveStatusEl = document.getElementById('saveStatus');

  let checked = new Set();
  let activeGen = 0;
  let onlyDup = false;
  let saveTimer = null;

  const STORAGE_KEY = 'pokedex-dupes';

  function setStatus(text, isError){
    if(!saveStatusEl) return;
    saveStatusEl.textContent = text;
    saveStatusEl.style.color = isError ? 'var(--dup)' : 'var(--text-muted)';
  }

  async function loadState(){
    setStatus('Carregando dados salvos...');
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const arr = JSON.parse(res.value);
        checked = new Set(arr);
      }
      setStatus(checked.size ? 'Dados carregados' : '');
    }catch(e){
      setStatus('');
    }
    render();
  }

  function saveState(){
    setStatus('Salvando...');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        await window.storage.set(STORAGE_KEY, JSON.stringify(Array.from(checked)), false);
        setStatus('Salvo');
        setTimeout(()=>setStatus(''), 1500);
      }catch(e){
        console.error('storage error', e);
        setStatus('Erro ao salvar - tente novamente', true);
      }
    }, 250);
  }

  const gens = [
    [0,'Todas'],[1,'Gen 1'],[2,'Gen 2'],[3,'Gen 3'],[4,'Gen 4'],
    [5,'Gen 5'],[6,'Gen 6'],[7,'Gen 7'],[8,'Gen 8'],[9,'Gen 9']
  ];
  gens.forEach(([g,label])=>{
    const b = document.createElement('button');
    b.className = 'gen-btn' + (g===0?' active':'');
    b.textContent = label;
    b.dataset.gen = g;
    b.addEventListener('click', ()=>{
      activeGen = g;
      document.querySelectorAll('.gen-btn').forEach(x=>x.classList.toggle('active', x===b));
      render();
    });
    gensEl.appendChild(b);
  });

  function pad(n){ return String(n).padStart(4,'0'); }

  function matches(p, q){
    if(!q) return true;
    q = q.toLowerCase().trim();
    if(String(p.id) === q) return true;
    if(pad(p.id).includes(q)) return true;
    return p.name.toLowerCase().includes(q);
  }

  function render(){
    const q = search.value;
    let list = POKEDEX.filter(p => matches(p,q) && (activeGen===0 || p.gen===activeGen) && (!onlyDup || checked.has(p.id)));
    if(sortSel.value === 'az'){
      list = list.slice().sort((a,b)=> a.name.localeCompare(b.name));
    }
    totalCountEl.textContent = POKEDEX.length;
    showCountEl.textContent = list.length;
    dupCountEl.textContent = checked.size;

    grid.innerHTML = '';
    if(list.length === 0){
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Nenhum pokemon encontrado.';
      grid.appendChild(d);
      return;
    }
    const frag = document.createDocumentFragment();
    for(const p of list){
      const card = document.createElement('div');
      card.className = 'card' + (checked.has(p.id) ? ' checked' : '');
      card.dataset.id = p.id;
      card.innerHTML =
        '<div class="card-top"><span class="num">#'+pad(p.id)+'</span>' +
        '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div>' +
        '<div class="name">'+p.name+'</div>' +
        (p.myth ? '<div class="tag">Mitico</div>' : (p.leg ? '<div class="tag">Lendario</div>' : ''));
      card.addEventListener('click', ()=>{
        const id = p.id;
        if(checked.has(id)) checked.delete(id); else checked.add(id);
        card.classList.toggle('checked');
        dupCountEl.textContent = checked.size;
        if(onlyDup) render();
        saveState();
      });
      frag.appendChild(card);
    }
    grid.appendChild(frag);
  }

  search.addEventListener('input', render);
  sortSel.addEventListener('change', render);
  toggleDup.addEventListener('click', ()=>{
    onlyDup = !onlyDup;
    toggleDup.classList.toggle('active', onlyDup);
    toggleDup.textContent = onlyDup ? 'Mostrando so repetidas' : 'Mostrar so repetidas';
    render();
  });
  clearBtn.addEventListener('click', ()=>{
    if(checked.size===0) return;
    if(confirm('Limpar todas as marcacoes de repetidas?')){
      checked.clear();
      saveState();
      render();
    }
  });

  loadState();
})();
</script>
</body>
</html>
